name: k6 Load Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & start services
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for api-gateway to be healthy
        run: |
          for i in $(seq 1 24); do
            curl -sf http://localhost:8080/actuator/health && break
            echo "Waiting... ($i/24)"
            sleep 5
          done

      - name: Run seeder
        run: docker compose -f docker-compose.test.yml run --rm seeder

      - name: Install k6
        uses: grafana/setup-k6-action@v1


      - name: Run k6 tests
        run: |
          k6 run ./tests/k6-runner.js \
            --env BASE_URL=http://localhost:8080 \
            --env TOKEN=${{ secrets.AUTH_TOKEN }}

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: k6/results/

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
