services:
  api-gateway-db:
    container_name: api-gateway
    image: postgres:16
    restart: always
    environment: 
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: routes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
