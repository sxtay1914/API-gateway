services:
  api-gateway-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: routes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d routes"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api-gateway-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://api-gateway-db:5432/routes
      SPRING_DATA_REDIS_HOST: redis        # overrides your localhost default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.0.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:11.0.0
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  mock-downstream:
    image: nginx:alpine
    ports:
      - "8081:80"

  seeder:
    environment:
      DB_HOST: api-gateway-db
      DB_PORT: 5432
      DB_NAME: routes
      DB_USER: postgres
      DB_PASSWORD: password
      DOWNSTREAM_URL: http://mock-downstream:80
    build:
      context: ./seeder
    depends_on:
      api-gateway:
        condition: service_healthy
